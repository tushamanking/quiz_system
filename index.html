<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Pantone palette:
   Classic Blue 19-4052 #0F4C81 · Peach Fuzz 13-1023 #FFBE98 · Greenery 15-0343 #88B04B
   Viva Magenta 18-1750 #BB2649 · Ultimate Gray 17-5104 #939597 · Cloud Dancer 11-4201 #F0EEE9 · Very Peri 17-3938 #6667AB */
:root{
  --scale:1;
  --bg:#F0EEE9; --surface:#FFFFFF; --surface-2:#E7E4DE; --text:#1A2430; --muted:#6F7175; --line:#D9D6CF;
  --primary:#0F4C81; --on-primary:#FFFFFF; --primary-soft:rgba(15,76,129,.10);
  --focus:#6667AB;
  --hl:#FFBE98; --on-hl:#1A2430;
  --ok:#5E8A2E; --ok-soft:rgba(136,176,75,.18);
  --bad:#BB2649; --bad-soft:rgba(187,38,73,.10);
  --overlay:rgba(26,36,48,.45);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#16212D; --surface-2:#1E2B39; --text:#ECEAE5; --muted:#939597; --line:#2A3949;
  --primary:#5D93C8; --on-primary:#0E1620; --primary-soft:rgba(93,147,200,.16);
  --focus:#9C9DD6;
  --hl:#FFBE98; --on-hl:#0E1620;
  --ok:#88B04B; --ok-soft:rgba(136,176,75,.16);
  --bad:#E2577A; --bad-soft:rgba(226,87,122,.14);
  --overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--scale))}
html,body{margin:0;min-height:100%}
body{
  font-family:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.55;
  transition:background-color .25s,color .25s;
}
button,input,textarea{font:inherit;color:inherit}

/* ---------- layout ---------- */
.page{
  display:none;flex-direction:column;gap:1rem;min-height:100vh;min-height:100dvh;
  padding:max(1rem,env(safe-area-inset-top)) clamp(1rem,3vw,2.5rem) max(1rem,env(safe-area-inset-bottom));
}
.page.active{display:flex}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:.75rem 1rem;flex-wrap:wrap}
.where{font-size:.85rem;color:var(--muted)}
h1,h2{margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.25}
h1{font-size:1.6rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.muted{color:var(--muted)}

/* ---------- buttons ---------- */
.btn{
  font-size:1rem;font-weight:500;border:1px solid var(--line);background:var(--surface);
  padding:.55rem 1.15rem;border-radius:999px;cursor:pointer;min-height:2.6rem;
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  transition:border-color .15s,background-color .15s,filter .15s;
}
.btn:hover:not(:disabled){border-color:var(--text)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover:not(:disabled){filter:brightness(1.12);border-color:var(--primary)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.danger:hover:not(:disabled){background:var(--bad-soft);border-color:var(--bad)}
.btn.lg{font-size:1.15rem;padding:.8rem 2.2rem;min-height:3.3rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.icon{padding:.4rem .8rem;min-width:2.6rem}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}

/* ---------- checkbox (matches the mockup: solid square with tick) ---------- */
input[type=checkbox]{
  appearance:none;-webkit-appearance:none;margin:0;flex:none;cursor:pointer;
  width:1.45rem;height:1.45rem;border:2px solid var(--text);border-radius:6px;
  display:grid;place-content:center;background:var(--surface);transition:background-color .12s;
}
input[type=checkbox]:checked{background:var(--text)}
input[type=checkbox]:checked::after{
  content:"";width:.4rem;height:.75rem;border:solid var(--surface);border-width:0 .18rem .18rem 0;
  transform:translateY(-.08rem) rotate(45deg);
}

/* ---------- page 1 ---------- */
#jsonInput{
  flex:1;min-height:16rem;width:100%;resize:vertical;padding:1rem 1.1rem;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.95rem;line-height:1.5;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
}
.msg{min-height:1.5rem;font-size:.95rem}
.msg.err{color:var(--bad)}
.msg.ok{color:var(--ok)}
.filebtn input{display:none}

/* ---------- page 2 ---------- */
.tools{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.seg button{border:0;background:transparent;cursor:pointer;min-height:2.5rem;padding:0 .9rem;font-weight:600;border-radius:999px}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.seg span{font-size:.85rem;color:var(--muted);min-width:3.2rem;text-align:center;font-variant-numeric:tabular-nums}
.qlist{flex:1;min-height:12rem;overflow:auto;display:flex;flex-direction:column;gap:.5rem;padding:.15rem}
.qitem{display:flex;gap:1rem;align-items:flex-start;padding:.85rem 1.1rem;cursor:pointer;transition:opacity .15s}
.qitem.off{opacity:.5}
.qno{color:var(--muted);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.qtext{font-weight:500}
.qans{display:flex;gap:.25rem 1.25rem;flex-wrap:wrap;font-size:.88rem;color:var(--muted);margin-top:.15rem}
.qans .t::before{content:"✓ ";color:var(--ok);font-weight:700}
.qans .f::before{content:"✕ ";color:var(--bad);font-weight:700}
.footer{display:flex;flex-wrap:wrap;gap:.75rem 1.25rem;align-items:center;padding-top:1rem;border-top:1px solid var(--line)}
.opt{display:flex;gap:.7rem;align-items:center;cursor:pointer}
.btn[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.note{font-size:.88rem;color:var(--muted);flex-basis:100%;margin:-.25rem 0 0}

/* ---------- page 3: the board (the one bold moment) ---------- */
.board{
  flex:1;min-height:0;overflow:auto;align-content:start;padding:.3rem;
  display:grid;gap:clamp(.5rem,1.2vw,1rem);
  grid-template-columns:repeat(auto-fill,minmax(calc(4.6rem * var(--scale)),1fr));
}
.tile{
  position:relative;aspect-ratio:1;display:grid;place-items:center;
  background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
  font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;
  transition:transform .1s,background-color .1s,border-color .1s,opacity .2s;
}
.tile.hl{background:var(--hl);border-color:var(--hl);color:var(--on-hl);transform:scale(1.07)}
.tile.picked{background:var(--primary);border-color:var(--primary);color:var(--on-primary);transform:scale(1.1);box-shadow:0 0 0 .4rem var(--primary-soft)}
.tile.done{opacity:.25;text-decoration:line-through}
.tile.cool{opacity:.45;border-style:dashed}
.tile .cd{position:absolute;bottom:.3rem;font-size:.68rem;font-weight:500;color:var(--muted)}
.stage{display:flex;flex-direction:column;align-items:center;gap:.6rem;padding-top:.5rem}
.stat{font-size:.92rem;color:var(--muted);text-align:center}

/* ---------- page 4 & 5 ---------- */
.qbox{display:flex;align-items:center;justify-content:center;text-align:center;padding:clamp(1.25rem,4vw,3rem);overflow:auto}
.qbig{font-size:2rem;font-weight:600;line-height:1.35;max-width:40ch;overflow-wrap:anywhere}
.choices{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:clamp(.75rem,2vw,1.25rem)}
.choice{
  position:relative;min-height:9rem;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:2.75rem 1.25rem 2rem;border-width:2px;cursor:pointer;
  font-size:1.45rem;font-weight:500;overflow-wrap:anywhere;
  transition:border-color .15s,background-color .15s;
}
.choice input{position:absolute;top:1rem;left:1rem}
.choice .ctext{display:block;max-width:100%}
.choice .ctext.flip{animation:flip .16s ease-in-out}
@keyframes flip{50%{transform:scaleY(.4);opacity:.2}}
.choices.locked .choice{cursor:progress}
.choices.locked .choice input{opacity:.35}

/* page 4 fills the screen: question on top, both choices below */
#p4{height:100vh;height:100dvh;min-height:30rem}
#p4 .qbox{flex:1.2 1 0;min-height:8rem}
#p4 .choices{flex:1 1 0;min-height:10rem}
#p4 .choice{overflow:auto}
.shufnote{font-size:.85rem;color:var(--muted);margin-left:.75rem}
.choice .key{position:absolute;top:.95rem;right:1.1rem;font-size:.85rem;color:var(--muted);font-weight:600}
.choice.sel{border-color:var(--primary);background:var(--primary-soft)}
.choice.static{cursor:default}
.choice.correct{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice .mark{position:absolute;right:.9rem;bottom:.7rem;width:3rem;height:3rem}
.choice .badge{
  position:absolute;top:.9rem;left:1rem;font-size:.78rem;font-weight:600;
  background:var(--text);color:var(--bg);padding:.1rem .7rem;border-radius:999px;
}
.actions{display:flex;justify-content:flex-end;gap:.6rem;flex-wrap:wrap}
.verdict{font-size:2.4rem;font-weight:700;text-align:center;margin-top:.5rem}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.rq{text-align:center;font-size:1.15rem;color:var(--muted);max-width:60ch;margin:0 auto;overflow-wrap:anywhere}
.p5body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.5rem}

/* ---------- dialog ---------- */
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:1rem;background:var(--overlay)}
.modal.open{display:grid}
.dialog{width:100%;max-width:26rem;padding:1.75rem 1.5rem 1.5rem;text-align:center;animation:pop .18s ease-out}
.dialog .big{font-size:3.6rem;font-weight:700;color:var(--primary);line-height:1.1}
.dialog h2{font-size:1.3rem}
.dialog p{margin:.4rem 0 0;color:var(--muted)}
.dialog .row{justify-content:center;margin-top:1.4rem}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}

@media (max-width:640px){
  .choices{grid-template-columns:1fr}
  .choice{min-height:6.5rem}
  #p4{height:auto;min-height:100dvh}
  #p4 .qbox{flex:none;min-height:12rem}
  #p4 .choices{flex:none;min-height:0}
  .qbig{font-size:1.6rem}
  .tile{font-size:1.3rem}
  h1{font-size:1.35rem}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<!-- 1. Question import -->
<section class="page active" id="p1" aria-labelledby="h1">
  <div class="topbar">
    <div>
      <div class="where">นำเข้าคำถาม</div>
      <h1 id="h1">วาง JSON หรือเลือกไฟล์คำถาม</h1>
    </div>
    <div class="row">
      <label class="btn filebtn">เลือกไฟล์ .json<input type="file" id="fileInput" accept=".json,application/json,text/plain"></label>
      <button class="btn ghost" id="btnSample">ใส่ตัวอย่าง</button>
    </div>
  </div>
  <textarea id="jsonInput" spellcheck="false" placeholder='[
  {
    "question": "เมืองหลวงของออสเตรเลียคือ?",
    "true_ans": "แคนเบอร์รา",
    "false_ans": "ซิดนีย์"
  }
]'></textarea>
  <div class="row">
    <div class="msg grow" id="importMsg" role="status"></div>
    <button class="btn" id="btnUseSaved" hidden>ใช้ชุดคำถามเดิม</button>
    <button class="btn primary lg" id="btnImport">Import</button>
  </div>
</section>

<!-- 2. Question management -->
<section class="page" id="p2" aria-labelledby="h2">
  <div class="topbar">
    <div>
      <div class="where">จัดการคำถาม</div>
      <h1 id="h2">เลือกคำถามที่จะใช้ในเกม</h1>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="ขนาดตัวอักษร">
        <button id="fontDown" aria-label="ลดขนาดตัวอักษร">A−</button>
        <span id="fontLabel">100%</span>
        <button id="fontUp" aria-label="เพิ่มขนาดตัวอักษร">A+</button>
      </div>
      <button class="btn icon" id="musicBtn" aria-pressed="true" title="เพลงประกอบจะเล่นระหว่างเกม">♪ เพลง</button>
      <button class="btn icon" id="sfxBtn" aria-pressed="true">เสียงเอฟเฟกต์</button>
      <button class="btn icon" id="themeBtn" aria-label="สลับโหมดสว่าง/มืด"></button>
    </div>
  </div>
  <div class="row">
    <button class="btn ghost" id="selAll">เลือกทั้งหมด</button>
    <button class="btn ghost" id="selNone">ไม่เลือกเลย</button>
    <span class="muted grow" id="count"></span>
  </div>
  <div class="qlist" id="qlist"></div>
  <div class="footer">
    <label class="opt"><input type="checkbox" id="optRemove"> นำคำถามที่ใช้แล้วออกจากเกม</label>
    <span class="grow"></span>
    <button class="btn ghost" id="btnReimport">นำเข้าใหม่</button>
    <button class="btn primary lg" id="btnStart">เริ่มเกม</button>
    <p class="note" id="optNote"></p>
  </div>
</section>

<!-- 3. Random page -->
<section class="page" id="p3" aria-labelledby="h3">
  <div class="topbar">
    <div>
      <div class="where">สุ่มคำถาม</div>
      <h1 id="h3">กดสุ่มเพื่อเลือกข้อถัดไป</h1>
    </div>
    <div class="row">
      <button class="btn icon musicQuick" aria-pressed="true" aria-label="เปิด/ปิดเพลง">♪</button>
      <button class="btn danger" id="btnEnd">End</button>
    </div>
  </div>
  <div class="board" id="board" aria-live="polite"></div>
  <div class="stage">
    <button class="btn primary lg" id="btnRandom">Random a Question</button>
    <div class="stat" id="stat"></div>
  </div>
</section>

<!-- 4. Question show -->
<section class="page" id="p4" aria-labelledby="qText">
  <div class="topbar">
    <div class="where"><span id="qNo"></span><span class="shufnote" id="shufNote"></span></div>
    <button class="btn icon musicQuick" aria-pressed="true" aria-label="เปิด/ปิดเพลง">♪</button>
  </div>
  <div class="card qbox"><div class="qbig" id="qText"></div></div>
  <div class="choices" id="choices"></div>
  <div class="actions">
    <button class="btn primary lg" id="btnCheck" disabled>Check ans</button>
  </div>
</section>

<!-- 5. Question result -->
<section class="page" id="p5" aria-labelledby="verdict">
  <div class="topbar">
    <div class="where" id="rNo"></div>
    <button class="btn icon musicQuick" aria-pressed="true" aria-label="เปิด/ปิดเพลง">♪</button>
  </div>
  <div class="p5body">
    <div>
      <div class="verdict" id="verdict"></div>
      <p class="rq" id="rText"></p>
    </div>
    <div class="choices" id="resultChoices"></div>
  </div>
  <div class="actions">
    <button class="btn primary lg" id="btnBack">Back</button>
  </div>
</section>

<!-- yes / no dialog -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="card dialog">
    <div class="big" id="mBig"></div>
    <h2 id="mTitle"></h2>
    <p id="mMsg"></p>
    <div class="row">
      <button class="btn" id="mNo">ไม่</button>
      <button class="btn primary" id="mYes">ใช่</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const COOLDOWN = 10;
  const SCALES = [0.8, 0.9, 1, 1.1, 1.25, 1.4, 1.6, 1.8];

  /* ---------- storage (fails quietly inside sandboxed iframes, e.g. Google Sites) ---------- */
  const store = {
    get(k, d){ try{ const v = localStorage.getItem('quizshow_' + k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem('quizshow_' + k, JSON.stringify(v)); }catch(e){} }
  };


  /* ---------- sound (Web Audio, synthesized: no external files needed) ---------- */
  const Sound = (() => {
    let ctx = null, master, musicBus, sfxBus, noiseBuf, timer = null, nextT = 0, step = 0, bar = 0, playing = false;
    let musicOn = store.get('musicOn', true), sfxOn = store.get('sfxOn', true);
    const MUSIC_VOL = 0.3, BPM = 128, SD = 60 / BPM / 4;
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    // Am – F – C – G, a driving game-show loop
    const PROG = [{ b:45, c:[69,72,76] }, { b:41, c:[65,69,72] }, { b:48, c:[67,72,76] }, { b:43, c:[67,71,74] }];
    const ARP = [0,1,2,3,2,1,2,3,0,1,2,3,2,1,0,2];
    const BASS = [0,3,6,8,10,11,14];

    function ensure(){
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        const comp = ctx.createDynamicsCompressor();
        master = ctx.createGain(); master.gain.value = 0.9;
        master.connect(comp); comp.connect(ctx.destination);
        musicBus = ctx.createGain(); musicBus.gain.value = MUSIC_VOL; musicBus.connect(master);
        sfxBus = ctx.createGain(); sfxBus.gain.value = 0.7; sfxBus.connect(master);
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function tone(f, t, dur, { type='sine', gain=.2, dest, attack=.005, slide=null, filter=null } = {}){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      if (filter) { const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = filter; o.connect(fl); fl.connect(g); }
      else o.connect(g);
      g.connect(dest || sfxBus);
      o.start(t); o.stop(t + dur + 0.05);
    }
    function noise(t, dur, { gain=.2, type='highpass', freq=6000, q=1, dest, sweepTo=null } = {}){
      const src = ctx.createBufferSource(); src.buffer = noiseBuf;
      const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q;
      f.frequency.setValueAtTime(freq, t);
      if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(dest || sfxBus);
      src.start(t); src.stop(t + dur + 0.02);
    }
    function kick(t){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + .12);
      g.gain.setValueAtTime(.9, t); g.gain.exponentialRampToValueAtTime(.0001, t + .3);
      o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + .32);
    }
    function playStep(s, t){
      const ch = PROG[bar % 4];
      const notes = [ch.c[0], ch.c[1], ch.c[2], ch.c[0] + 12];
      if (s % 4 === 0) kick(t);
      if (s === 4 || s === 12) noise(t, .18, { gain:.35, type:'bandpass', freq:1800, q:.8, dest:musicBus });
      if (s % 2 === 1) noise(t, .04, { gain:.16, freq:8000, dest:musicBus });
      if (BASS.includes(s)) tone(mtof(ch.b - 12), t, SD * 1.6, { type:'sawtooth', gain:.32, filter:520, dest:musicBus });
      tone(mtof(notes[ARP[s]]), t, SD * .9, { type:'square', gain:.06, filter:2600, dest:musicBus });
      if (bar % 4 === 3 && s >= 8) noise(t, .07, { gain:.06 + (s - 8) * .03, type:'bandpass', freq:2200, dest:musicBus }); // snare build-up
    }
    function scheduler(){
      if (ctx.currentTime > nextT + .3) nextT = ctx.currentTime + .05; // catch up after the tab was hidden
      while (nextT < ctx.currentTime + .15) {
        playStep(step, nextT);
        nextT += SD;
        if (++step === 16) { step = 0; bar++; }
      }
    }
    const api = {
      get musicOn(){ return musicOn; }, get sfxOn(){ return sfxOn; },
      startMusic(){
        if (!musicOn || playing || !ensure()) return;
        playing = true; step = 0; bar = 0; nextT = ctx.currentTime + .08;
        musicBus.gain.cancelScheduledValues(ctx.currentTime);
        musicBus.gain.setValueAtTime(MUSIC_VOL, ctx.currentTime);
        timer = setInterval(scheduler, 25);
      },
      stopMusic(){ playing = false; clearInterval(timer); timer = null; },
      setMusic(on){ musicOn = on; store.set('musicOn', on); if (!on) api.stopMusic(); },
      setSfx(on){ sfxOn = on; store.set('sfxOn', on); },
      duck(level){ if (ctx) musicBus.gain.setTargetAtTime(MUSIC_VOL * level, ctx.currentTime, .08); },
      unduck(){ if (ctx) musicBus.gain.setTargetAtTime(MUSIC_VOL, ctx.currentTime, .3); },
      fx(name, p = 0){
        if (!sfxOn || !ensure()) return;
        const t = ctx.currentTime + .01;
        if (name === 'tick') tone(700 + p * 800, t, .05, { type:'square', gain:.12, filter:3200 });
        else if (name === 'land') { tone(988, t, .2, { type:'triangle', gain:.3 }); tone(1319, t + .1, .6, { type:'triangle', gain:.3 }); }
        else if (name === 'swap') { noise(t, .16, { type:'bandpass', freq:500, sweepTo:3200, q:2, gain:.3 }); tone(520 + p * 300, t, .06, { type:'triangle', gain:.12 }); }
        else if (name === 'select') tone(660, t, .08, { type:'triangle', gain:.18 });
        else if (name === 'correct') {
          [72,76,79,84].forEach((m, i) => { tone(mtof(m), t + i * .09, .25, { type:'triangle', gain:.28 }); tone(mtof(m), t + i * .09, .2, { type:'square', gain:.06, filter:3000 }); });
          [84,88,91].forEach(m => tone(mtof(m), t + .38, 1.1, { type:'triangle', gain:.18, attack:.02 }));
          noise(t + .38, .8, { gain:.08, freq:9000 });
        } else if (name === 'wrong') {
          [0, .02].forEach(d => {
            tone(233 + d * 300, t, .38, { type:'sawtooth', gain:.22, slide:185, filter:900 });
            tone(165 + d * 200, t + .42, .7, { type:'sawtooth', gain:.22, slide:98, filter:800 });
          });
        }
      }
    };
    return api;
  })();

  const SAMPLE = [
    {question:"ดาวเคราะห์ที่ใหญ่ที่สุดในระบบสุริยะคือ?", true_ans:"ดาวพฤหัสบดี", false_ans:"ดาวเสาร์"},
    {question:"น้ำบริสุทธิ์เดือดที่กี่องศาเซลเซียส (ที่ระดับน้ำทะเล)?", true_ans:"100 °C", false_ans:"90 °C"},
    {question:"เมืองหลวงของออสเตรเลียคือ?", true_ans:"แคนเบอร์รา", false_ans:"ซิดนีย์"},
    {question:"สัตว์ที่ใหญ่ที่สุดในโลกคือ?", true_ans:"วาฬสีน้ำเงิน", false_ans:"ช้างแอฟริกา"},
    {question:"ธาตุที่มีสัญลักษณ์ Au คือ?", true_ans:"ทองคำ", false_ans:"เงิน"},
    {question:"ภูเขาที่สูงที่สุดในโลกคือ?", true_ans:"เอเวอเรสต์", false_ans:"เคทู"},
    {question:"มหาสมุทรที่ใหญ่ที่สุดคือ?", true_ans:"มหาสมุทรแปซิฟิก", false_ans:"มหาสมุทรแอตแลนติก"},
    {question:"แมงมุมมีกี่ขา?", true_ans:"8 ขา", false_ans:"6 ขา"},
    {question:"ใครวาดภาพโมนาลิซา?", true_ans:"เลโอนาร์โด ดา วินชี", false_ans:"มีเกลันเจโล"},
    {question:"แสงจากดวงอาทิตย์ใช้เวลาเดินทางถึงโลกประมาณเท่าไร?", true_ans:"ประมาณ 8 นาที", false_ans:"ประมาณ 8 วินาที"},
    {question:"พืชใช้ก๊าซใดในการสังเคราะห์ด้วยแสง?", true_ans:"คาร์บอนไดออกไซด์", false_ans:"ออกซิเจน"},
    {question:"หนึ่งปีอธิกสุรทินมีกี่วัน?", true_ans:"366 วัน", false_ans:"365 วัน"}
  ];

  /* ---------- state ---------- */
  let questions = store.get('questions', []);
  let enabled = store.get('enabled', []);
  if (!Array.isArray(questions)) questions = [];
  if (!Array.isArray(enabled) || enabled.length !== questions.length) enabled = questions.map(() => true);
  let removeUsed = store.get('removeUsed', true);
  let scaleIdx = store.get('scaleIdx', 2);
  if (!(scaleIdx >= 0 && scaleIdx < SCALES.length)) scaleIdx = 2;
  let theme = store.get('theme', null);
  if (theme !== 'light' && theme !== 'dark') {
    theme = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }

  const game = { pool:[], used:new Set(), history:[], removeUsed:true, cur:-1, order:[], pick:-1, spinning:false };
  let tiles = [];

  /* ---------- helpers ---------- */
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const rnd = n => Math.floor(Math.random() * n);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const str = v => (v === undefined || v === null) ? '' : String(v).trim();
  const showPage = n => {
    document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'p' + n));
    window.scrollTo(0, 0);
  };
  const ICON_OK = '<svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M9 25l10 10L39 13" fill="none" stroke="var(--ok)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const ICON_BAD = '<svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M12 12l24 24M36 12L12 36" fill="none" stroke="var(--bad)" stroke-width="6" stroke-linecap="round"/></svg>';

  /* ---------- theme & font ---------- */
  function applyTheme(){
    document.documentElement.setAttribute('data-theme', theme);
    $('#themeBtn').textContent = theme === 'dark' ? '☀ โหมดสว่าง' : '☾ โหมดมืด';
  }
  function applyScale(){
    document.documentElement.style.setProperty('--scale', SCALES[scaleIdx]);
    $('#fontLabel').textContent = Math.round(SCALES[scaleIdx] * 100) + '%';
    $('#fontDown').disabled = scaleIdx === 0;
    $('#fontUp').disabled = scaleIdx === SCALES.length - 1;
  }
  function syncSoundBtns(){
    $('#musicBtn').setAttribute('aria-pressed', Sound.musicOn);
    $('#sfxBtn').setAttribute('aria-pressed', Sound.sfxOn);
    document.querySelectorAll('.musicQuick').forEach(b => b.setAttribute('aria-pressed', Sound.musicOn));
  }
  const inGame = () => ['p3','p4','p5'].some(id => document.getElementById(id).classList.contains('active'));
  const toggleMusic = () => { Sound.setMusic(!Sound.musicOn); if (Sound.musicOn && inGame()) Sound.startMusic(); syncSoundBtns(); };
  $('#musicBtn').onclick = toggleMusic;
  document.querySelectorAll('.musicQuick').forEach(b => b.onclick = toggleMusic);
  $('#sfxBtn').onclick = () => { Sound.setSfx(!Sound.sfxOn); syncSoundBtns(); if (Sound.sfxOn) Sound.fx('select'); };
  $('#themeBtn').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; store.set('theme', theme); applyTheme(); };
  $('#fontDown').onclick = () => { if (scaleIdx > 0) { scaleIdx--; store.set('scaleIdx', scaleIdx); applyScale(); } };
  $('#fontUp').onclick = () => { if (scaleIdx < SCALES.length - 1) { scaleIdx++; store.set('scaleIdx', scaleIdx); applyScale(); } };

  /* ---------- dialog ---------- */
  function ask({ big = '', title = '', msg = '', yes = 'ใช่', no = 'ไม่' }){
    return new Promise(resolve => {
      const modal = $('#modal');
      $('#mBig').textContent = big; $('#mBig').hidden = !big;
      $('#mTitle').textContent = title;
      $('#mMsg').textContent = msg;
      $('#mYes').textContent = yes; $('#mNo').textContent = no;
      const onKey = e => { if (e.key === 'Escape') done(false); };
      const done = v => {
        modal.classList.remove('open');
        $('#mYes').onclick = $('#mNo').onclick = modal.onclick = null;
        document.removeEventListener('keydown', onKey);
        resolve(v);
      };
      $('#mYes').onclick = () => done(true);
      $('#mNo').onclick = () => done(false);
      modal.onclick = e => { if (e.target === modal) done(false); };
      document.addEventListener('keydown', onKey);
      modal.classList.add('open');
      setTimeout(() => $('#mYes').focus(), 30);
    });
  }

  /* ---------- page 1: import ---------- */
  function parseQuestions(text){
    text = text.replace(/^\uFEFF/, '').trim();
    if (!text) throw new Error('วาง JSON ลงในช่อง หรือกด “เลือกไฟล์ .json” ก่อน');
    const cleaned = text.replace(/,(\s*[}\]])/g, '$1'); // allow trailing commas like the sample format
    let data;
    try { data = JSON.parse(cleaned); }
    catch (e) { throw new Error('อ่าน JSON ไม่ได้: ' + e.message); }
    if (!Array.isArray(data)) data = [data];
    const out = [], bad = [];
    data.forEach((it, i) => {
      const q = str(it && it.question), t = str(it && it.true_ans), f = str(it && it.false_ans);
      if (q && t && f) out.push({ question:q, true_ans:t, false_ans:f });
      else bad.push(i + 1);
    });
    if (bad.length) throw new Error('รายการที่ ' + bad.slice(0, 10).join(', ') + (bad.length > 10 ? ' …' : '') + ' ข้อมูลไม่ครบ ต้องมี question, true_ans และ false_ans');
    if (!out.length) throw new Error('ไม่พบคำถามในข้อมูล');
    return out;
  }
  function setMsg(text, kind){ const m = $('#importMsg'); m.textContent = text; m.className = 'msg grow ' + (kind || ''); }

  $('#fileInput').onchange = e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { $('#jsonInput').value = r.result; setMsg('โหลด “' + f.name + '” แล้ว กด Import เพื่อใช้คำถามชุดนี้', 'ok'); };
    r.onerror = () => setMsg('เปิดไฟล์ไม่ได้ ลองเลือกไฟล์อีกครั้ง', 'err');
    r.readAsText(f, 'utf-8');
    e.target.value = '';
  };
  $('#btnSample').onclick = () => { $('#jsonInput').value = JSON.stringify(SAMPLE, null, 2); setMsg('ใส่คำถามตัวอย่าง 12 ข้อแล้ว', 'ok'); };
  $('#btnImport').onclick = () => {
    try {
      questions = parseQuestions($('#jsonInput').value);
      enabled = questions.map(() => true);
      store.set('questions', questions); store.set('enabled', enabled);
      setMsg('');
      renderManage(); showPage(2);
    } catch (e) { setMsg(e.message, 'err'); }
  };
  $('#btnUseSaved').onclick = () => { renderManage(); showPage(2); };

  /* ---------- page 2: manage ---------- */
  function renderManage(){
    const list = $('#qlist'); list.innerHTML = '';
    questions.forEach((q, i) => {
      const item = el('label', 'card qitem' + (enabled[i] ? '' : ' off'));
      const cb = el('input'); cb.type = 'checkbox'; cb.checked = enabled[i];
      cb.onchange = () => { enabled[i] = cb.checked; item.classList.toggle('off', !cb.checked); store.set('enabled', enabled); updateCount(); };
      const body = el('div', 'grow');
      body.append(el('div', 'qtext', q.question));
      const ans = el('div', 'qans'); ans.append(el('span', 't', q.true_ans), el('span', 'f', q.false_ans));
      body.append(ans);
      item.append(cb, el('span', 'qno', i + 1), body);
      list.append(item);
    });
    $('#optRemove').checked = removeUsed;
    updateCount(); updateNote();
  }
  function updateCount(){
    const n = enabled.filter(Boolean).length;
    $('#count').textContent = 'เลือกไว้ ' + n + ' จาก ' + questions.length + ' ข้อ';
    $('#btnStart').disabled = n === 0;
  }
  function updateNote(){
    $('#optNote').textContent = removeUsed
      ? 'คำถามที่สุ่มได้แล้วจะไม่ถูกสุ่มอีกจนจบเกม'
      : 'คำถามใช้ซ้ำได้ แต่ข้อที่สุ่มได้แล้วจะไม่กลับมาภายใน ' + COOLDOWN + ' ข้อถัดไป';
  }
  const setAll = v => { enabled = enabled.map(() => v); store.set('enabled', enabled); renderManage(); };
  $('#selAll').onclick = () => setAll(true);
  $('#selNone').onclick = () => setAll(false);
  $('#optRemove').onchange = e => { removeUsed = e.target.checked; store.set('removeUsed', removeUsed); updateNote(); };
  $('#btnReimport').onclick = () => {
    $('#jsonInput').value = JSON.stringify(questions, null, 2);
    setMsg(''); refreshSavedBtn(); showPage(1);
  };
  $('#btnStart').onclick = () => {
    game.pool = questions.map((_, i) => i).filter(i => enabled[i]);
    if (!game.pool.length) return;
    game.used = new Set(); game.history = []; game.removeUsed = removeUsed;
    renderBoard(); showPage(3);
    Sound.startMusic();
  };

  /* ---------- page 3: random ---------- */
  // How many most-recent picks are blocked. With fewer than 11 questions the full 10 can't be honoured,
  // so it shrinks to (count − 1) to keep the game playable.
  const cooldownSize = () => Math.min(COOLDOWN, game.pool.length - 1);
  function cooldownLeft(pos){
    const k = cooldownSize(); if (k <= 0) return 0;
    const last = game.history.lastIndexOf(pos); if (last < 0) return 0;
    const ago = game.history.length - 1 - last; // 0 = just used
    return ago < k ? k - ago : 0;
  }
  function eligible(){
    return game.pool.map((_, pos) => pos).filter(pos =>
      game.removeUsed ? !game.used.has(pos) : cooldownLeft(pos) === 0);
  }
  function renderBoard(){
    const board = $('#board'); board.innerHTML = ''; tiles = [];
    game.pool.forEach((_, pos) => {
      const t = el('div', 'tile', pos + 1);
      if (game.removeUsed && game.used.has(pos)) { t.classList.add('done'); t.setAttribute('aria-label', 'ข้อ ' + (pos + 1) + ' ใช้แล้ว'); }
      else if (!game.removeUsed) {
        const left = cooldownLeft(pos);
        if (left) { t.classList.add('cool'); t.append(el('span', 'cd', 'พัก ' + left)); }
      }
      tiles.push(t); board.append(t);
    });
    const el_ = eligible();
    const n = game.pool.length;
    let s;
    if (game.removeUsed) {
      s = el_.length ? 'เหลือ ' + el_.length + ' จาก ' + n + ' ข้อ' : 'ใช้คำถามครบทุกข้อแล้ว กด End เพื่อจบเกม';
    } else {
      const k = cooldownSize();
      s = 'สุ่มไปแล้ว ' + game.history.length + ' ครั้ง';
      if (k < COOLDOWN) s += ' (มีคำถาม ' + n + ' ข้อ ข้อที่สุ่มแล้วจึงพักได้ ' + k + ' ข้อ)';
    }
    $('#stat').textContent = s;
    $('#btnRandom').disabled = !el_.length;
    $('#btnEnd').disabled = false;
  }
  function spin(){
    if (game.spinning) return;
    const pool = eligible(); if (!pool.length) return;
    game.spinning = true;
    $('#btnRandom').disabled = true; $('#btnEnd').disabled = true;
    tiles.forEach(t => t.classList.remove('hl', 'picked'));
    const final = pool[rnd(pool.length)];
    Sound.duck(.35);
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const steps = reduce ? 1 : 22 + rnd(8);
    let i = 0, prev = -1;
    const tick = () => {
      if (prev >= 0) tiles[prev].classList.remove('hl');
      i++;
      let cur;
      if (i >= steps) cur = final;
      else { do { cur = pool[rnd(pool.length)]; } while (pool.length > 1 && cur === prev); }
      tiles[cur].classList.add('hl');
      Sound.fx('tick', i / steps);
      prev = cur;
      if (i < steps) { const p = i / steps; setTimeout(tick, 45 + Math.pow(p, 3) * 430); }
      else setTimeout(() => landed(cur), reduce ? 0 : 300);
    };
    tick();
  }
  async function landed(pos){
    const t = tiles[pos];
    t.classList.remove('hl'); t.classList.add('picked');
    Sound.fx('land');
    t.scrollIntoView({ block:'nearest', behavior:'smooth' });
    game.spinning = false;
    const ok = await ask({ big:String(pos + 1), title:'สุ่มได้ข้อ ' + (pos + 1), msg:'ใช้คำถามข้อนี้ใช่ไหม', yes:'ใช่ ใช้ข้อนี้', no:'ไม่ สุ่มใหม่' });
    Sound.unduck();
    if (ok) {
      game.history.push(pos);
      if (game.removeUsed) game.used.add(pos);
      showQuestion(pos);
    } else renderBoard();
  }
  $('#btnRandom').onclick = spin;
  $('#btnEnd').onclick = async () => {
    if (game.spinning) return;
    const ok = await ask({ title:'จบเกมนี้?', msg:'ระบบจะกลับไปหน้าจัดการคำถาม และล้างประวัติการสุ่มของเกมนี้', yes:'ใช่ จบเกม', no:'ไม่ เล่นต่อ' });
    if (ok) { Sound.stopMusic(); renderManage(); showPage(2); }
  };

  /* ---------- page 4: question ---------- */
  let shuffleTimer = null;
  function showQuestion(pos){
    const q = questions[game.pool[pos]];
    game.cur = pos; game.pick = -1;
    game.order = shuffle([{ text:q.true_ans, correct:true }, { text:q.false_ans, correct:false }]);
    $('#qNo').textContent = 'คำถามข้อ ' + (pos + 1);
    $('#qText').textContent = q.question;
    const wrap = $('#choices'); wrap.innerHTML = '';
    const boxes = [], texts = [];
    game.order.forEach((c, idx) => {
      const card = el('label', 'card choice');
      const cb = el('input'); cb.type = 'checkbox';
      cb.onchange = () => {
        game.pick = cb.checked ? idx : -1;
        boxes.forEach((b, j) => { if (j !== idx) b.checked = false; b.parentElement.classList.toggle('sel', b.checked); });
        $('#btnCheck').disabled = game.pick < 0;
        if (cb.checked) Sound.fx('select');
      };
      const tx = el('span', 'ctext', '');
      boxes.push(cb); texts.push(tx);
      card.append(cb, el('span', 'key', idx === 0 ? 'A' : 'B'), tx);
      wrap.append(card);
    });
    $('#btnCheck').disabled = true;
    showPage(4);
    shuffleChoices(boxes, texts);
  }
  // Visibly swap the two answers a few times, then settle on the random order in game.order.
  function shuffleChoices(boxes, texts){
    clearTimeout(shuffleTimer);
    const wrap = $('#choices'), note = $('#shufNote');
    const a = game.order[0].text, b = game.order[1].text;
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const swaps = reduce ? 0 : 7 + rnd(3);
    const lock = on => {
      wrap.classList.toggle('locked', on);
      boxes.forEach((cb, i) => { cb.disabled = on; cb.setAttribute('aria-label', 'เลือก ' + game.order[i].text); });
      note.textContent = on ? 'กำลังสุ่มตำแหน่งตัวเลือก' : '';
    };
    const show = (first, second) => { texts[0].textContent = first; texts[1].textContent = second; };
    if (!swaps) { show(a, b); lock(false); return; }
    lock(true);
    let k = 0;
    show(swaps % 2 ? b : a, swaps % 2 ? a : b); // start so the last swap lands on the final order
    const step = () => {
      k++;
      texts.forEach(t => { t.classList.remove('flip'); void t.offsetWidth; t.classList.add('flip'); });
      Sound.fx('swap', k / swaps);
      setTimeout(() => {
        const flipped = (swaps - k) % 2 === 1;
        show(flipped ? b : a, flipped ? a : b);
      }, 80);
      if (k < swaps) shuffleTimer = setTimeout(step, 110 + k * k * 10);
      else shuffleTimer = setTimeout(() => lock(false), 260);
    };
    shuffleTimer = setTimeout(step, 400);
  }
  $('#btnCheck').onclick = () => { if (game.pick >= 0) showResult(); };

  /* ---------- page 5: result ---------- */
  function showResult(){
    const q = questions[game.pool[game.cur]];
    const right = game.order[game.pick].correct;
    $('#rNo').textContent = 'ผลคำถามข้อ ' + (game.cur + 1);
    const v = $('#verdict');
    v.textContent = right ? 'ถูกต้อง' : 'ยังไม่ถูก';
    Sound.duck(.2); Sound.fx(right ? 'correct' : 'wrong');
    setTimeout(() => Sound.unduck(), 1700);
    v.className = 'verdict ' + (right ? 'ok' : 'bad');
    $('#rText').textContent = q.question;
    const wrap = $('#resultChoices'); wrap.innerHTML = '';
    game.order.forEach((c, idx) => {
      const card = el('div', 'card choice static ' + (c.correct ? 'correct' : 'wrong'));
      if (idx === game.pick) card.append(el('span', 'badge', 'คำตอบที่เลือก'));
      card.append(el('span', 'key', idx === 0 ? 'A' : 'B'), el('span', '', c.text));
      card.insertAdjacentHTML('beforeend', c.correct ? ICON_OK : ICON_BAD);
      wrap.append(card);
    });
    showPage(5);
  }
  $('#btnBack').onclick = () => { renderBoard(); showPage(3); };

  /* ---------- init ---------- */
  function refreshSavedBtn(){
    const b = $('#btnUseSaved');
    b.hidden = !questions.length;
    b.textContent = 'ใช้ชุดคำถามเดิม (' + questions.length + ' ข้อ)';
  }
  applyTheme(); applyScale(); refreshSavedBtn(); syncSoundBtns();
  if (questions.length) $('#jsonInput').value = JSON.stringify(questions, null, 2);
})();
</script>
</body>
</html>
